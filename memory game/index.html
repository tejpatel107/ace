<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Memory Puzzle Game</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="./index.css" />

    <script type="module" defer src="scripts/index.js"></script>
    <script src="https://kit.fontawesome.com/d4087d137f.js" crossorigin="anonymous"></script>
  </head>

  <body>
    <main class="game-container">
      <header class="game-header">
        <h1>Memory Puzzle</h1>

        <div class="game-info">
          <div class="timer">
            <span>Time</span>
            <strong>00:00:00</strong>
          </div>

          <button class="refresh-button" type="button">
            <span>New Game</span>
          </button>
        </div>
      </header>

      <section class="game-board" id="game-board"></section>

      <p class="message"></p>
    </main>
  </body>
</html>
